apiVersion: apps/v1
kind: Deployment
metadata:
  name: shopsphere-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: shopsphere-backend
  template:
    metadata:
      labels:
        app: shopsphere-backend
    spec:
      containers:
        - name: backend
          image: kiran626/shopsphere-backend:latest
          ports:
            - containerPort: 5000