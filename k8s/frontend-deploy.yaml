apiVersion: apps/v1
kind: Deployment
metadata:
  name: shopsphere-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: shopsphere-frontend
  template:
    metadata:
      labels:
        app: shopsphere-frontend
    spec:
      containers:
        - name: frontend
          image: kiran626/shopsphere-frontend:latest
          ports:
            - containerPort: 80